[project]
name = "nested-sampling-book"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anesthetic>=2.10.3",
    "blackjax",
    "distrax>=0.1.5",
    "flax>=0.10.4",
    "ipywidgets>=8.1.9",
    "jax>=0.4.31",
    "jaxlib>=0.4.31",
    "jimgw>=0.2.0",
    "jupyter-book<2",
    "optax>=0.2.4",
    "sbi>=0.25.0",
    "sphinx-sitemap>=2.9.0",
    "tensorflow-probability>=0.25.0",
    "tojax>=1.0.1",
    "torch",
]

[tool.uv.sources]
# Nested sampling lives in the main BlackJAX repo but is not yet in a tagged
# PyPI release, so install from the main branch (git required). Once released
# this whole [tool.uv.sources] block can be dropped in favour of plain PyPI.
blackjax = { git = "https://github.com/blackjax-devs/blackjax.git", branch = "main" }
