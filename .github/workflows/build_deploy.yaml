name: deploy-book

# Run this when the master or main branch changes
on:
  push:
    branches:
    - master
    - main
  # Allow manually re-running a deploy from the Actions tab / `gh workflow run`,
  # so a transient Pages hiccup doesn't require an empty commit to retry.
  workflow_dispatch:

# Serialise Pages deployments: only one runs at a time, and in-progress ones are
# not cancelled (cancelling mid-deploy can leave Pages in a bad state). This also
# avoids the "multiple artifacts named github-pages" error a job rerun can cause.
concurrency:
  group: pages
  cancel-in-progress: false

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # (optional) Cache your executed notebooks between runs
    # if you have config:
    # execute:
    #   execute_notebooks: cache
    - name: cache executed notebooks
      uses: actions/cache@v3
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # Build the book
    - name: Build the book
      run: |
        jupyter-book build .

    # Upload the book's HTML as an artifact
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "_build/html"

    # Deploy the book's HTML to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
